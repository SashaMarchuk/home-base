name: home-sweep
# Daily report-only sweep of this repo's issues (scripts/home-sweep --same-repo).
on:
  # A push that changes this file runs it once, which also makes GitHub register it.
  push:
    paths:
      - .github/workflows/home-sweep.yml
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: read
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Sweep this repo's issues (report only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f home.config ]; then echo "No home.config: nothing to sweep."; exit 0; fi
          scripts/home-sweep --same-repo | tee sweep.txt
          if [ -s sweep.txt ]; then { echo "## home-sweep"; sed 's/^/- /' sweep.txt; } >> "$GITHUB_STEP_SUMMARY"; fi
