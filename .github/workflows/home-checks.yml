name: home-checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Skip outside a home
        id: home
        run: |
          if [ -f home.config ]; then echo "is_home=1" >> "$GITHUB_OUTPUT"; else echo "No home.config, nothing to check."; fi
      - name: Install gitleaks
        if: steps.home.outputs.is_home == '1'
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Run checks
        if: steps.home.outputs.is_home == '1'
        run: scripts/checks/run
